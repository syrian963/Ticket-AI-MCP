# A tag verifies and builds; publishing is asked for separately. The tag has
# to agree with the version in pyproject.toml and in server.json, because a
# release that says 0.1.0 on PyPI, 0.1.1 in the metadata and 0.0.9 in the
# registry manifest is a support question nobody can answer - so this refuses
# rather than guesses.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI (leave off to only verify and build)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: The tag and the declared version have to match
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(uv run python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag $tag, pyproject $declared"
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag v$tag does not match version $declared in pyproject.toml"
            exit 1
          fi

      - name: The changelog has to mention it
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! grep -q "\[$tag\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $tag"
            exit 1
          fi

      # The manifest agreeing with pyproject is a test, so running the suite
      # covers it - no second implementation of the same check.
      - name: Everything green before anything is published
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uv run --with twine twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Tagging and publishing are two decisions, and this used to make them one.
  # A tag is how a version gets recorded; PyPI is public and a version there
  # cannot be replaced, so it waits to be asked for by hand. Run this workflow
  # from the tag with `publish` ticked when that is what you mean.
  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Trusted publishing: PyPI verifies the workflow rather than a token, so
      # there is no long-lived credential in this repository at all.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A release has more than one destination, so it can fail half way.
          # Without this, the re-run that would finish the job dies on the part
          # that already succeeded.
          skip-existing: true

  registry:
    # After PyPI, because the manifest names a version and the registry checks
    # that the version is really there.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # The same mechanism as trusted publishing above: no token anywhere.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          version=$(gh release view --repo modelcontextprotocol/registry \
            --json tagName --jq .tagName)
          curl -fsSL -o publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${version}/mcp-publisher_linux_amd64.tar.gz"
          tar xzf publisher.tar.gz mcp-publisher
        env:
          GH_TOKEN: ${{ github.token }}
      - name: The manifest has to say what the tag says
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(python -c "import json;print(json.load(open('server.json'))['version'])")
          echo "tag $tag, server.json $declared"
          if [ "$tag" != "$declared" ]; then
            echo "::error::server.json says $declared and the tag says $tag"
            exit 1
          fi
      - name: Publish to the MCP registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  github_release:
    if: startsWith(github.ref, 'refs/tags/v')
    # The Releases page is the third destination, and the one most easily
    # forgotten: a tag on its own does not create a release, so the page can
    # sit several versions behind while the badge says otherwise. The notes
    # come from the changelog, so there is only ever one text.
    needs: registry
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create it if it is not there
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already has a release"
            exit 0
          fi
          python tools/release_notes.py "$tag" > notes.md
          gh release create "$tag" --title "$tag" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
